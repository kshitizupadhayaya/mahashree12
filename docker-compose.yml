# MongoDB Atlas runtime: app connects using MONGODB_URI from .env.
# No local database containers are started/exposed by default.
# Do not commit .env or real credentials.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mahashree-cde-app
    restart: unless-stopped
    init: true
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 8000
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Required in .env: ADMIN_PASSWORD, SESSION_SECRET, MONGODB_URI, MONGODB_DB
    volumes:
      - app_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8000/api/health',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  app_data:
