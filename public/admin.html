<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard | Mahashree Namkeen</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #1e293b;
        --panel-hover: #2d3748;
        --text: #f8fafc;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --accent-hover: #7dd3fc;
        --danger: #ef4444;
        --success: #22c55e;
        --orange: #f97316;
        --border: #334155;
        --radius: 12px;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        overflow-x: hidden;
      }
      .layout { display: flex; height: 100vh; }
      .sidebar {
        width: min(280px, 88vw);
        background: rgba(30, 41, 59, 0.92);
        backdrop-filter: blur(10px);
        border-right: 1px solid rgba(255,255,255,0.06);
        display: flex;
        flex-direction: column;
        position: fixed;
        left: 0; top: 0; bottom: 0;
        z-index: 100;
        transform: translateX(0);
        transition: transform 0.25s ease;
      }
      .sidebar.hidden { transform: translateX(-100%); }
      .sidebar-header {
        padding: 20px 24px;
        display: flex;
        align-items: center;
        gap: 12px;
        border-bottom: 1px solid var(--border);
      }
      .brand-mark {
        width: 42px; height: 42px; border-radius: 10px;
        background: linear-gradient(135deg, #f97316, #3b82f6);
        display: grid; place-items: center; font-weight: 800; color: #fff; font-size: 1.2rem;
      }
      .sidebar-brand { font-weight: 700; font-size: 1.1rem; color: #fff; }
      .nav-title {
        padding: 24px 24px 10px 24px;
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
        font-weight: 700;
      }
      .nav-item {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 12px 24px;
        color: var(--muted);
        text-decoration: none;
        font-size: 0.92rem;
        border-radius: 8px;
        margin: 2px 12px;
        cursor: pointer;
        transition: background 0.15s, color 0.15s;
      }
      .nav-item:hover { background: var(--panel-hover); color: #fff; }
      .nav-item.active { background: rgba(56, 189, 248, 0.15); color: var(--accent); }
      .nav-item svg { width: 20px; height: 20px; flex-shrink: 0; }
      .nav-item.active svg { color: var(--accent); }
      .main {
        flex: 1;
        margin-left: 260px;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      .topbar {
        height: 64px;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 28px;
        position: sticky; top: 0; z-index: 50;
      }
      .topbar-left { display: flex; align-items: center; gap: 16px; }
      .menu-btn {
        background: rgba(30, 41, 59, 0.55);
        border: 1px solid rgba(255,255,255,0.12);
        width: 34px; height: 34px;
        border-radius: 8px;
        display: grid; place-items: center;
        color: #fff;
        cursor: pointer;
        backdrop-filter: blur(4px);
        display: none;
      }
      @media (max-width: 900px) { .menu-btn { display: grid; } }
      .search {
        position: relative; flex: 1; max-width: 420px;
      }
      .search input {
        width: 100%; background: #0f172a; border: 1px solid var(--border);
        border-radius: 10px; padding: 10px 14px 10px 40px; color: #fff;
        font-size: 0.92rem; outline: none;
      }
      .search input:focus { border-color: var(--accent); }
      .search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); }
      .topbar-right { display: flex; align-items: center; gap: 14px; }
      .user-chip {
        display: flex; align-items: center; gap: 10px;
        background: var(--panel-hover); border: 1px solid var(--border);
        border-radius: 10px; padding: 8px 14px; cursor: pointer;
      }
      .user-avatar {
        width: 34px; height: 34px; border-radius: 10px; background: var(--accent);
        display: grid; place-items: center; font-weight: 700; color: #000; font-size: 0.95rem;
      }
      .user-name { font-size: 0.9rem; font-weight: 600; white-space: nowrap; overflow: hidden; }
      .content { flex: 1; padding: 32px 28px; overflow-y: auto; }
      .page-header {
        display: flex; align-items: center; justify-content: space-between;
        margin-bottom: 28px;
      }
      .page-header h2 { font-size: 1.5rem; font-weight: 700; color: #fff; }
      .page-sub { color: var(--muted); font-size: 0.95rem; }
      .actions-bar { display: flex; gap: 10px; align-items: center; }
      .btn {
        border: none; border-radius: 10px; padding: 10px 18px;
        font-size: 0.9rem; font-weight: 600; cursor: pointer;
        display: inline-flex; align-items: center; gap: 8px;
        transition: transform 0.1s, opacity 0.15s;
      }
      .btn:active { transform: scale(0.97); }
      .btn-primary { background: var(--accent); color: #000; }
      .btn-primary:hover { background: var(--accent-hover); }
      .btn-danger { background: var(--danger); color: #fff; }
      .btn-danger:hover { background: #dc2626; }
      .btn-success { background: var(--success); color: #fff; }
      .btn-success:hover { background: #16a34a; }
      .btn-outline {
        background: transparent; border: 1px solid var(--border); color: var(--text);
      }
      .btn-outline:hover { background: var(--panel-hover); }
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 20px;
        margin-bottom: 32px;
      }
      .stat-card {
        background: linear-gradient(135deg, #2d3748, #3a465a);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 22px 24px;
        box-shadow: 0 4px 16px rgba(0,0,0,0.3);
      }
      .stat-row { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
      .stat-label { color: var(--muted); font-size: 0.88rem; font-weight: 600; }
      .stat-value { font-size: 1.8rem; font-weight: 800; color: #fff; }
      .stat-delta { font-size: 0.82rem; margin-top: 4px; }
      .stat-delta.pos { color: var(--success); }
      .stat-delta.neg { color: var(--danger); }
      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 24px;
        margin-bottom: 28px;
      }
      .panel h3 { font-size: 1.1rem; font-weight: 700; margin-bottom: 18px; color: #fff; }
      .table-wrap { overflow-x: auto; }
      table { width: 100%; border-collapse: collapse; }
      th, td { text-align: left; padding: 14px 16px; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
      th { color: var(--muted); font-weight: 600; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; }
      tr:hover td { background: rgba(255,255,255,0.02); }
      .badge {
        display: inline-flex; align-items: center; gap: 6px;
        padding: 4px 10px; border-radius: 999px; font-size: 0.8rem; font-weight: 700;
      }
      .badge-success { background: rgba(34, 197, 94, 0.15); color: var(--success); }
      .badge-danger { background: rgba(239, 68, 68, 0.15); color: var(--danger); }
      .badge-neutral { background: rgba(148, 163, 184, 0.15); color: var(--muted); }
      .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 20px; }
      .field { display: flex; flex-direction: column; gap: 6px; }
      .field label { font-size: 0.85rem; font-weight: 600; color: var(--muted); }
      .field input, .field textarea, .field select {
        background: #0f172a; border: 1px solid var(--border); border-radius: 10px;
        padding: 10px 14px; color: #fff; font-size: 0.92rem; outline: none; width: 100%;
      }
      .field input:focus, .field textarea:focus { border-color: var(--accent); }
      .field textarea { min-height: 80px; resize: vertical; }
      .grid-cols-2 { grid-template-columns: 1fr 1fr; }
      .empty-state {
        text-align: center; padding: 48px 24px; color: var(--muted);
      }
      .empty-state svg { width: 56px; height: 56px; margin-bottom: 14px; color: var(--border); }
      .toolbar {
        display: flex; gap: 12px; align-items: center; margin-bottom: 22px;
        flex-wrap: wrap;
      }
      .toolbar input, .toolbar select {
        width: 340px; max-width: 100%;
        background: #0f172a; border: 1px solid var(--border); border-radius: 10px;
        padding: 12px 16px; color: #fff; font-size: 0.98rem; outline: none;
      }
      .orders-table th, .orders-table td { padding: 18px 16px; font-size: 0.95rem; }
      .orders-table tr td { font-size: 0.95rem; }
      .orders-section .panel h3 { font-size: 1.25rem; margin-bottom: 16px; }
      .orders-section { padding-bottom: 24px; }
      @media (max-width: 900px) {
        .sidebar { transform: translateX(-100%); z-index: 110; box-shadow: none; width: min(250px, 82vw); }
        .menu-btn { display: grid; }
        .main { margin-left: 0; }
        .stats-grid { grid-template-columns: 1fr 1fr; }
      }
      @media (max-width: 600px) {
        .stats-grid { grid-template-columns: 1fr; }
        .content { padding: 20px 16px; }
        .topbar { padding: 0 16px; }
      }
      #side-overlay {
        display: none;
        position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 105; backdrop-filter: blur(2px);
        opacity: 0; pointer-events: none; transition: opacity .2s ease;
      }
      #side-overlay.open { display: block; opacity: 1; pointer-events: auto; }
      .sidebar-close-btn { display:none; margin-left:auto; background:transparent; border:1px solid var(--border); color:var(--text); width:34px; height:34px; border-radius:8px; cursor:pointer; font-size:1.3rem; line-height:1; }
      @media (max-width: 900px) {
        .sidebar-close-btn { display:grid; place-items:center; }
        .sidebar.open { transform: translateX(0) !important; box-shadow: 10px 0 30px rgba(0,0,0,.35); }
      }
      @media (min-width: 901px) {
        #side-overlay, #side-overlay.open { display: none !important; opacity: 0 !important; pointer-events: none !important; backdrop-filter: none !important; }
        .sidebar { transform: translateX(0) !important; }
      }
      .avatar { width: 32px; height: 32px; border-radius: 8px; background: var(--accent); display: grid; place-items: center; font-weight: 700; color: #000; }
      .text-success { color: var(--success); }
      .text-danger { color: var(--danger); }
      .text-muted { color: var(--muted); }
      .order-cards { display: grid; gap: 14px; }
      .card-section { margin-bottom: 24px; }
      .order-card {
        background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
        padding: 18px 20px; margin-bottom: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      }
      .order-card-done { opacity: 0.85; }
      .order-head { display: flex; justify-content: space-between; align-items: start; margin-bottom: 12px; gap: 12px; }
      .order-id { font-weight: 700; color: var(--accent); font-size: 1.05rem; }
      .order-cust { font-weight: 600; color: #fff; margin-top: 4px; }
      .order-loc { color: var(--muted); font-size: 0.85rem; margin-top: 2px; }
      .order-time { color: var(--muted); font-size: 0.82rem; text-align: right; white-space: nowrap; }
      .order-items { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
      .chip { background: rgba(30,41,59,0.5); border: 1px solid var(--border); border-radius: 20px; padding: 4px 10px; font-size: 0.8rem; color: var(--text); }
      .order-foot { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); padding-top: 14px; }
      .order-total { font-weight: 700; font-size: 1.1rem; color: var(--success); }
      .order-actions { display: flex; gap: 8px; flex-wrap: wrap; }
      .accept-btn { background: var(--success); color: #fff; }
      .reject-btn { background: var(--danger); color: #fff; }
      .order-actions .btn { padding: 8px 14px; font-size: 0.82rem; }
    </style>
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <div class="brand-mark">M</div>
          <div class="sidebar-brand">Mahashree Admin</div>
          <button type="button" class="sidebar-close-btn" aria-label="Close menu" onclick="closeSidebar()">×</button>
        </div>
        <div class="nav-title">Navigation</div>
        <a href="#" class="nav-item active" onclick="return switchPage('dashboard', this)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
          Dashboard
        </a>
        <a href="#" class="nav-item" onclick="return switchPage('products', this)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
          Products
        </a>
        <a href="#" class="nav-item" onclick="return switchPage('places', this)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
          Places
        </a>
        <a href="#" class="nav-item" onclick="return switchPage('orders', this)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
          Orders
        </a>
        <a href="#" class="nav-item" onclick="return switchPage('trash', this)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          Trash
        </a>
        <div class="nav-title" style="margin-top:auto">Account</div>
        <a href="#" class="nav-item" onclick="return switchPage('settings', this)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2v-4a1.65 1.65 0 0 0-1.51-1l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82-.33h.07a1.65 1.65 0 0 0 1.51 1v.07a1.65 1.65 0 0 0 1 1.51h4a1.65 1.65 0 0 0 1-1v-4a1.65 1.65 0 0 0 .33-1.82z"/></svg>
          Settings
        </a>
        <button class="nav-item" style="color:var(--danger)" onclick="logout()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Logout
        </button>
      </aside>
      <div id="side-overlay" aria-hidden="true" onclick="closeSidebar()"></div>

      <div class="main">
        <header class="topbar">
          <div class="topbar-left">
            <button class="menu-btn" id="menuBtn" aria-label="Toggle menu" onclick="toggleSidebar()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            </button>
            <div class="search">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              <input type="search" placeholder="Search orders, products, customers…" />
            </div>
          </div>
          <div class="topbar-right">
            <div class="user-chip">
              <div class="user-avatar">M</div>
              <div>
                <div class="user-name">Admin</div>
              </div>
            </div>
          </div>
        </header>

        <div class="content" id="content">
          <!-- pages injected here -->
        </div>
      </div>
    </div>

    <script>const pages = {};
let currentPage = 'dashboard';

function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmt(v){return `NPR ${Number(v||0).toFixed(0)}`;}
async function adminApi(path, options={}){
  const url = String(path || '');
  const method = String(options.method || 'GET').toUpperCase();
  try {
    const r = await fetch(url, { credentials: 'include', ...options });
    let res = null;
    const ct = r.headers.get('content-type') || '';
    if (ct.includes('application/json')) { try { res = await r.json(); } catch {} }
    if (!res) { try { const t = await r.text(); res = t ? { message: t.slice(0, 200) } : {}; } catch { res = {}; } }
    if (!r.ok) {
      const is401 = r.status === 401;
      if (is401) { try { location.href = '/admin'; } catch {} }
      const msg = (res && (res.message || res.error)) || (is401 ? 'Admin session expired. Please log in again.' : `Request failed (${r.status})`);
      const detail = ` [${method} ${url}, HTTP ${r.status}]`;
      const err = new Error(`${msg}${detail}`);
      err.status = r.status; err.url = url; err.method = method; err.response = res;
      throw err;
    }
    return res;
  } catch (e) {
    if (e && /Failed to fetch|NetworkError/i.test(e.message || '')) throw new Error(`Network error calling ${method} ${url}: ${e.message}`);
    throw e;
  }
}

function dateStr(v){const d=new Date(v);return Number.isNaN(d.getTime())?'—':d.toLocaleString();}

function switchPage(name, el){
  closeSidebar();
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  const target = el || document.querySelector(`.nav-item[onclick*="'${name}'"]`);
  if(target) target.classList.add('active');
  currentPage = name;
  renderPage(name);
  return false;
}

async function loadDash(){
  const r=await fetch('/api/admin/dashboard',{credentials:'include'});
  const res=await r.json();
  if(!r.ok){if(r.status===401)location.href='/admin';throw new Error(res.message||'fail');}
  return res;
}

function openSidebar(){
  const s=document.getElementById('sidebar');
  const ov=document.getElementById('side-overlay');
  if(!s) return;
  if(window.innerWidth>900) return;
  s.classList.add('open');
  s.style.transform='translateX(0)';
  if(ov){ ov.classList.add('open'); ov.setAttribute('aria-hidden','false'); }
  document.body.style.overflow='hidden';
}
function closeSidebar(){
  const s=document.getElementById('sidebar');
  const ov=document.getElementById('side-overlay');
  if(s){ s.classList.remove('open'); if(window.innerWidth<=900) s.style.transform='translateX(-100%)'; }
  if(ov){ ov.classList.remove('open'); ov.setAttribute('aria-hidden','true'); }
  document.body.style.overflow='';
}
function toggleSidebar(){
  const s=document.getElementById('sidebar');
  if(!s) return;
  (window.innerWidth<=900 && s.classList.contains('open')) ? closeSidebar() : openSidebar();
}

let dashboardRefreshTimer = null;
let currentAdminPage = 'dashboard';
function stopDashboardAutoRefresh(){ if(dashboardRefreshTimer){ clearInterval(dashboardRefreshTimer); dashboardRefreshTimer=null; } }
function startDashboardAutoRefresh(){
  stopDashboardAutoRefresh();
  if(currentAdminPage !== 'dashboard') return;
  dashboardRefreshTimer = setInterval(async()=>{
    if(currentAdminPage !== 'dashboard' || document.hidden) return;
    try{
      const r=await fetch('/api/admin/dashboard',{credentials:'include'});
      const res=await r.json();
      if(!r.ok || !res.success) return;
      dashboardOrders=res.orders||[];
      renderRecentOrders(Array.isArray(dashboardOrders)?dashboardOrders:[]);
      const d=res.dashboard||{};
      document.querySelectorAll('.stat-card .stat-value').forEach((el,i)=>{ const vals=[Number(d.total_orders||0),fmt(d.total_revenue||0),Number(d.today_orders||0),fmt(d.today_revenue||0),Number(d.week_orders||0),fmt(d.week_revenue||0),Number(d.month_orders||0),fmt(d.month_revenue||0)]; if(vals[i]!=null) el.textContent=vals[i]; });
    }catch{}
  }, 10000);
}

async function renderPage(name){
  closeSidebar();
  const content=document.getElementById('content');
  if(name==='dashboard'){
    try{
      const res=await loadDash();
      const d=res.dashboard||{};
      content.innerHTML=`
        <div class="page-header"><div><h2>Dashboard</h2><div class="page-sub">Overview of orders, revenue and activity.</div></div><div class="actions-bar"><button id="clear-stats-btn" type="button" class="btn btn-outline" onclick="return clearOverviewStatistics()">Clear Statistics</button></div></div>
        <div class="stats-grid">
          <div class="stat-card"><div class="stat-row"><span class="stat-label">Total Orders</span></div><div class="stat-value">${Number(d.total_orders||0)}</div><div class="stat-delta pos">All time</div></div>
          <div class="stat-card"><div class="stat-row"><span class="stat-label">Total Revenue</span></div><div class="stat-value">${fmt(d.total_revenue||0)}</div><div class="stat-delta pos">All time</div></div>
          <div class="stat-card"><div class="stat-row"><span class="stat-label">Today Orders</span></div><div class="stat-value">${Number(d.today_orders||0)}</div><div class="stat-delta pos">Today</div></div>
          <div class="stat-card"><div class="stat-row"><span class="stat-label">Today Revenue</span></div><div class="stat-value">${fmt(d.today_revenue||0)}</div><div class="stat-delta pos">Today</div></div>

async function clearTrash(){
  const ids=(Array.isArray(dashboardOrders)?dashboardOrders:[]).filter(o=>['cancelled','rejected','failed','refunded'].includes(String(o.status||'').toLowerCase())).map(o=>o.id);
  if(!ids.length){ alert('Trash is already empty.'); return; }
  if(!confirm(`Remove ${ids.length} trashed order(s) from the active list? Historical revenue/statistics will be preserved.`)) return;
  let ok=0, fail=0;
  for(const id of ids){ try { await adminApi(`/api/admin/orders/${encodeURIComponent(id)}`,{method:'DELETE'}); ok++; } catch(e){ fail++; } }
  alert(`Trash active records removed: ${ok}${fail?`, failed: ${fail}`:''}. Historical records preserved.`);
  const dr=await loadDash(); dashboardOrders=dr.orders||[]; await loadTrash(); renderOrders(dashboardOrders); if(currentAdminPage==='dashboard') await renderPage('dashboard');

function renderTrash(list){

  if(!list.length){el.innerHTML='<div class="empty-state">No orders in Trash.</div>';return;}

function renderOrders(list){
  const q=document.getElementById('order-search')?.value.trim().toLowerCase()||'';
  const period=document.getElementById('order-period')?.value||'all';
  const now=Date.now();const today=new Date().toDateString();
  const f=list.filter(o=>{
    const d=new Date(o.created_at);
    if(period==='today'&&d.toDateString()!==today)return false;
    if(period==='week'&&(!Number.isFinite(d.getTime())||now-d.getTime()>7*24*60*60*1000))return false;
    if(period==='month'&&(!Number.isFinite(d.getTime())||d.getMonth()!==new Date().getMonth()))return false;
    const items=(o.items||[]).map(i=>i.name||'').join(' ');
    return `${o.id||''} ${o.customer_name||''} ${o.phone||''} ${o.email||''} ${items}`.toLowerCase().includes(q);
  });
  const isTrashed=s=>['cancelled','rejected','failed','refunded'].includes(String(s||'').toLowerCase());
  const accepted=f.filter(o=>{const st=String(o.status||'pending').toLowerCase(); return st && st!=='pending' && !isTrashed(st);});
  const el=document.getElementById('order-table');
  if(!accepted.length){el.innerHTML='<div class="empty-state">No accepted orders in Order Items.</div>';return;}
  el.innerHTML=`<div class="order-cards">${accepted.map(o=>orderCard(o,'orders-del')).join('')}</div>`;
  el.querySelectorAll('.del-btn').forEach(b=>b.addEventListener('click',async()=>{
    const id=b.dataset.id;if(!confirm('Move this order to Trash?'))return; b.disabled=true;
    try{ await adminApi(`/api/admin/orders/${encodeURIComponent(id)}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:'rejected'})}); alert('Moved to Trash.'); const dr=await loadDash(); dashboardOrders=dr.orders||[]; renderOrders(dashboardOrders); loadTrash(); }catch(e){ alert(e.message); b.disabled=false; }
  }));
}
function orderCard(o,ctx){
  const items=(o.items||[]).map(i=>{const up=Number(i.price??i.unit_price??i.unitPrice??0)||0;const qty=Number(i.quantity||0)||0;return `<span class="chip">${i.image?`<img src=\"${escapeHtml(i.image)}\" alt=\"\" style=\"width:18px;height:18px;object-fit:cover;border-radius:4px;vertical-align:middle;margin-right:4px\"/>`:''}${escapeHtml(i.name||'Item')} ×${qty} @ ${fmt(up)}</span>`;}).join('') || '<span class="text-muted">No items</span>';
  const pay = escapeHtml(o.payment_status || o.paymentStatus || 'Pending');
  const payM = escapeHtml(o.payment_method || o.paymentMethod || '—');
  const del = escapeHtml(o.delivery_address || o.address || o.customer?.address || '—');
  const computedSub=(o.items||[]).reduce((s,i)=>s+(Number(i.price??i.unit_price??i.unitPrice??0)||0)*(Number(i.quantity||0)||0),0);
  const subN = Number(o.subtotal ?? 0) > 0 ? Number(o.subtotal) : (computedSub || Number(o.total||0));
  const totalN = Number(o.total ?? 0) > 0 ? Number(o.total) : subN;
  const sub = fmt(subN); const tot = fmt(totalN);
  const ex=`<button class="btn btn-outline" style="padding:6px 10px;font-size:12px" onclick="return exportOrders('pdf','${escapeHtml(o.id)}')">PDF</button><button class="btn btn-outline" style="padding:6px 10px;font-size:12px" onclick="return exportOrders('csv','${escapeHtml(o.id)}')">CSV</button>`;
  const actions = ctx==='orders-del'?`${ex}<button class="btn del-btn" data-id="${escapeHtml(o.id)}" style="background:transparent;border:1px solid var(--border);color:var(--muted);padding:8px 12px;font-size:0.85rem">Move to Trash</button>`:ctx==='trash'?`${ex}`:`${ex}<button class="btn accept-btn" data-id="${escapeHtml(o.id)}">Accept Order</button><button class="btn trash-btn" data-id="${escapeHtml(o.id)}">Reject Order</button>`;
  return `<div class="order-card">
    <div class="order-head"><div><div class="order-id">Order #${escapeHtml(o.id)}</div><div class="order-cust">${escapeHtml(o.customer_name||o.customer?.name||'N/A')} · ${escapeHtml(o.phone||o.customer?.phone||'')}</div><div class="order-loc">${del}</div></div><div class="order-time">${dateStr(o.created_at)}</div></div>
    <div class="order-items">${items}</div>
    <div class="order-meta" style="font-size:12px;color:#555;padding:0 14px 8px">Payment: ${payM} · ${pay} · Status: ${escapeHtml(o.status||'pending')}<br/>Subtotal ${sub} · Total ${tot}</div>
    <div class="order-foot"><div class="order-total">${tot}</div><div class="order-actions">${actions}</div></div>
  </div>`;
}
async function renderRecentOrders(list, allCount){
  const el=document.getElementById('recent-orders');

  try{
    const pending=(Array.isArray(list)?list:[]).filter(o=>{const s=String(o?.status||'pending').toLowerCase().trim(); return !s || s==='pending';});

      catch(e){ alert(e.message||'Failed to reject order.'); b.disabled=false; b.textContent='Reject Order'; }
    }));
  }catch(e){ console.error('Pending orders render error',e); el.innerHTML=`<div class="empty-state">Failed to display pending orders: ${escapeHtml(e.message||'unknown error')} <button class="btn btn-outline" onclick="renderPage('dashboard')">Retry</button></div>`; }

    if(!cr.ok || cres.success===false) throw new Error(cres.message||`Categories API failed (${cr.status})`);
    adminCategories=Array.isArray(cres.categories)?cres.categories:[]; const products=Array.isArray(pres.products)?pres.products:[];
    window.__adminCategoriesProducts = products;
    renderCategoriesAdmin(products, embedded); populateProductCategorySelect();
  }catch(e){ if(el) el.innerHTML=`<div class="empty-state">Failed to load categories: ${escapeHtml(e.message||e)}</div>`; console.error(e); }
}
function renderCategoriesAdmin(products, embedded=false){
  const el=document.getElementById('category-table'); if(!el) return;
  const q=(document.getElementById('category-search')?.value||'').trim().toLowerCase();
  const cats=(adminCategories||[]).filter(c=>!q || `${c.label||''} ${c.slug||''} ${c.description||''}`.toLowerCase().includes(q));
  if(!cats.length){el.innerHTML='<div class="empty-state">No categories found.</div>';return;}
  el.innerHTML=`<table><thead><tr><th>Category</th><th>Slug / ID</th><th>Description</th><th>Products</th><th>Actions</th></tr></thead><tbody>${cats.map(c=>{
    const isSystem = c.slug==='all-products' || c.slug==='uncategorized' || c.system;
    const icon = c.icon ? `<span style="font-size:1.1rem;margin-right:6px">${escapeHtml(c.icon)}</span>` : '';
    return `<tr><td>${icon}<strong>${escapeHtml(c.label||c.slug)}</strong>${c.slug==='all-products'?'<div class="text-muted" style="font-size:12px">Special system filter — shows all products</div>':(c.slug==='uncategorized'?'<div class="text-muted" style="font-size:12px">Products with no category (still visible in Products)</div>':'')}</td><td><code>${escapeHtml(c.slug)}</code></td><td>${escapeHtml(c.description||'—')}</td><td><strong>${Number(c.count||0)}</strong></td><td style="white-space:nowrap"><button class="btn btn-outline" onclick="viewCategoryProducts('${escapeHtml(c.slug)}')">View Products</button> ${isSystem?'':`<button class="btn btn-outline" onclick="editCategoryMeta('${escapeHtml(c.slug)}')">Edit</button> <button class="btn btn-danger" onclick="deleteCategorySafe('${escapeHtml(c.slug)}')">Delete</button>`} ${c.slug==='all-products'?`<button class=\"btn btn-primary\" onclick=\"return switchPage('products', this)\">Open Products</button>`:''}</td></tr>`;
  }).join('')}</tbody></table>`;
}
function editCategoryMeta(slug){
  const cat=(adminCategories||[]).find(c=>c.slug===slug); if(!cat) return;
  const label=prompt('Category name:', cat.label||slug); if(label==null) return;
  const description=prompt('Description (optional):', cat.description||'') ?? (cat.description||'');
  const icon=prompt('Icon/emoji (optional):', cat.icon||'') ?? (cat.icon||'');
  const meta=getCategoryMeta(); meta[slug]={...(meta[slug]||{}), label:String(label).trim()||cat.label, description:String(description).trim(), icon:String(icon).trim()};
  saveCategoryMeta(meta);
  loadCategoriesAdmin();
}
function deleteCategorySafe(slug){
  if(slug==='all-products'||slug==='uncategorized') return;
  if(!confirm(`Delete category "${slug}"? Products will NOT be deleted; assigned products will become Uncategorized and remain visible in All Products.`)) return;
  reassignCategoryProducts(slug,'uncategorized');
}
async function reassignCategoryProducts(fromSlug,toSlug){
  const products=window.__adminCategoriesProducts||[];
  const targets=products.filter(p=>p.category===fromSlug);
  if(!targets.length){ alert('No products are assigned to this category. It can be treated as removed from active use; products were not deleted.'); loadCategoriesAdmin(); return; }
  if(toSlug==='uncategorized'){
    alert('Products cannot be safely reclassified automatically without guessing. Please reassign these products to the correct category from the Products page. No products were deleted.');
    viewCategoryProducts(fromSlug);
    return;
  }
  let ok=0, fail=0;
  for(const p of targets){
    try{
      const r=await fetch(`/api/admin/products/${p.id}`,{credentials:'include',method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({category: toSlug})});
      if(r.ok) ok++; else fail++;
    }catch{ fail++; }
  }
  alert(`Updated ${ok} product assignment(s).${fail?` ${fail} failed.`:''} Products were not deleted.`);
  loadCategoriesAdmin();
}
function getCategoryMeta(){ try{return JSON.parse(localStorage.getItem('adminCategoryMeta')||'{}')}catch{return{}} }
function saveCategoryMeta(v){ localStorage.setItem('adminCategoryMeta', JSON.stringify(v||{})); }

function viewCategoryProducts(slug){
  const products=window.__adminCategoriesProducts||[];
  const list = slug==='all-products' ? products : slug==='uncategorized' ? products.filter(p=>p.category==='uncategorized'||!p.category) : products.filter(p=>p.category===slug);
  const panel=document.getElementById('category-products-panel'); const table=document.getElementById('category-products-table'); const title=document.getElementById('category-products-title');
  if(!panel||!table) return;
  panel.style.display='block';
  const label = ((adminCategories||[]).find(c=>c.slug===slug)||{}).label || slug;
  title.textContent=`${label} — ${list.length} product${list.length===1?'':'s'}`;
  if(!list.length){table.innerHTML='<div class="empty-state">No products are assigned to this category yet. You can assign existing products from the Products page.</div>'; panel.scrollIntoView({behavior:'smooth'}); return;}
  table.innerHTML=`<table><thead><tr><th>Name</th><th>Category</th><th>Price</th></tr></thead><tbody>${list.map(p=>`<tr><td>${escapeHtml(p.name)}</td><td>${escapeHtml(p.categoryLabel||p.category)}</td><td>${fmt(p.price)}</td></tr>`).join('')}</tbody></table>`;
  panel.scrollIntoView({behavior:'smooth'});
}


async function exportOrders(format, orderIdArg){
  try{
    const scope = orderIdArg ? 'selected' : (document.getElementById('export-scope')?.value || 'all');
    const from = document.getElementById('export-from')?.value || '';
    const to = document.getElementById('export-to')?.value || '';
    const orderId = orderIdArg || document.getElementById('export-id')?.value?.trim() || '';
    const st = document.getElementById('export-status'); if(st) st.textContent = 'Preparing export…';
    const params = new URLSearchParams({format, scope, from, to, orderId});
    const r = await fetch('/api/admin/orders/export?'+params.toString(), {credentials:'include'});
    if(!r.ok){ let msg='Export failed.'; try{ const j=await r.json(); msg=j.message||msg; }catch{} throw new Error(msg); }
    const ct = r.headers.get('content-type')||'';
    if(format==='print' || ct.includes('text/html')){
      const html = await r.text();
      const w = window.open('','_blank'); if(w){ w.document.write(html); w.document.close(); setTimeout(()=>w.print(), 400); } else alert('Pop-up blocked. Allow pop-ups to print.');
      if(st) st.textContent='Print report opened.'; return false;
    }
    const blob = await r.blob();
    const cd = r.headers.get('content-disposition')||''; const m = cd.match(/filename="?([^"]+)"?/);
    const name = m?m[1]:`orders.${format==='xlsx'?'xlsx':format==='pdf'?'pdf':'csv'}`;
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
    if(st) st.textContent=`Downloaded ${name}`; return false;
  }catch(e){ const st=document.getElementById('export-status'); if(st) st.textContent=''; alert(e.message||'Export failed.'); return false; }
}
window.exportOrders = exportOrders;

let _statsRefreshSeq = 0;
let _statsClearInFlight = false;
async function clearOverviewStatistics(){
  if(_statsClearInFlight) return false;
  const msg = "Are you sure you want to permanently reset all dashboard statistics? This action cannot be undone. Actual orders, customers, products, and other business records will remain untouched.";
  if(!confirm(msg)) return false;
  const btn = document.getElementById('clear-stats-btn');
  const orig = btn ? btn.textContent : '';
  const seq = ++_statsRefreshSeq;
  _statsClearInFlight = true;
  try{
    if(btn){ btn.disabled=true; btn.textContent='Clearing…'; btn.style.opacity='0.7'; btn.setAttribute('aria-busy','true'); }
    const cards = Array.from(document.querySelectorAll('.stat-card .stat-value'));
    cards.forEach(el=>{ if(el) el.textContent='…'; });
    // Use adminApi for consistent credentials, JSON parsing, 401 handling, and error messages.
    const res = await adminApi('/api/admin/dashboard/refresh-stats', { method:'POST', headers:{'Content-Type':'application/json'}, body:'{}' });
    if(seq !== _statsRefreshSeq) return false;
    if(!res || !res.success) throw new Error((res && res.message) || 'Unable to clear statistics.');
    const d = res.dashboard || {};
    const vals=[Number(d.total_orders||0),fmt(d.total_revenue||0),Number(d.today_orders||0),fmt(d.today_revenue||0),Number(d.week_orders||0),fmt(d.week_revenue||0),Number(d.month_orders||0),fmt(d.month_revenue||0)];
    const liveCards = Array.from(document.querySelectorAll('.stat-card .stat-value'));
    (liveCards.length ? liveCards : cards).forEach((el,i)=>{ if(el && vals[i]!=null) el.textContent=vals[i]; });
    alert('All dashboard statistics have been successfully reset.');
  }catch(e){
    console.error('Clear Statistics failed:', e);
    if (e && e.status === 401) return false; // redirect handled
    const reason = e && e.message ? String(e.message) : 'Failed to clear statistics.';
    alert('Clear Statistics failed: ' + reason);
    try { await renderPage('dashboard'); } catch {}
  }finally{
    _statsClearInFlight = false;
    const liveBtn = document.getElementById('clear-stats-btn') || btn;
    if(liveBtn){ liveBtn.disabled=false; liveBtn.textContent=orig||'Clear Statistics'; liveBtn.style.opacity=''; liveBtn.removeAttribute('aria-busy'); }
  }
  return false;
}
window.clearOverviewStatistics = clearOverviewStatistics;
</script>
