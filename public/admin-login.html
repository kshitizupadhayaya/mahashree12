<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login | Mahashree Namkeen</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #fffaf3, #ffe2cf);
        font-family: Arial, sans-serif;
      }
      .panel {
        width: min(420px, calc(100% - 24px));
        background: white;
        border-radius: 20px;
        box-shadow: 0 24px 48px rgba(0, 0, 0, 0.08);
        padding: 32px 28px;
      }
      h1 { margin-top: 0; }
      form { display: flex; flex-direction: column; gap: 14px; }
      input {
        border: 1px solid #ddd;
        border-radius: 12px;
        padding: 12px 14px;
        font-size: 1rem;
      }
      button {
        border: none;
        border-radius: 12px;
        background: #d62828;
        color: white;
        font-weight: 700;
        padding: 12px 14px;
        cursor: pointer;
      }
      .note { color: #666; margin-top: 18px; font-size: 0.95rem; }
      .error { color: #b42318; margin-top: 12px; display: none; }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>Admin Login</h1>
      <form id="admin-login-form">
        <input type="password" id="admin-password" placeholder="Enter admin password" required />
        <button type="submit">Login</button>
      </form>
      <p class="error" id="login-error">Incorrect password.</p>
      <p class="note">This page is only for authorized Mahashree Namkeen administrators.</p>
    </div>

    <script>
      const form = document.getElementById('admin-login-form');
      const errorBox = document.getElementById('login-error');

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const password = document.getElementById('admin-password').value;

        const response = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });

        const result = await response.json();

        if (response.ok && result.success) {
          window.location.href = '/admin';
          return;
        }

        errorBox.style.display = 'block';
        errorBox.textContent = result.message || 'Login failed.';
      });
    </script>
  </body>
</html>
