services:
  - type: web
    name: mahashree-namkeen
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8000
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: true
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: mahashree_namkeen
